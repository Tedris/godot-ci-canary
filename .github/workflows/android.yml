name: Android Export (APK)

on:
  workflow_dispatch:
  push:
    branches: [canary-android]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.6
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.6-stable_linux.x86_64 godot
          chmod +x godot

      - name: Install export templates
        run: |
          curl -sL -o t.tpz https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable
          unzip -q t.tpz -d tpz
          mv tpz/templates/* ~/.local/share/godot/export_templates/4.6.stable/
          rm -rf t.tpz tpz

      - name: Generate debug keystore
        run: |
          export JAVA_HOME=${JAVA_HOME:-$JAVA_HOME_17_X64}
          mkdir -p ~/.local/share/godot/keystores
          "$JAVA_HOME/bin/keytool" -genkey -keystore ~/.local/share/godot/keystores/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "cn=Godot, ou=Godot Engine, o=Stichting Godot, c=NL"

      - name: Import
        run: ./godot --headless --import

      - name: Export Android APK
        run: |
          export JAVA_HOME=${JAVA_HOME:-$JAVA_HOME_17_X64}
          echo "JAVA_HOME=$JAVA_HOME ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools"
          mkdir -p build/android
          ./godot --headless --export-debug "Android" build/android/canary.apk

      - name: Inspect APK
        run: |
          unzip -l build/android/canary.apk | grep -E 'arm64|godot' | head
          ls -la build/android/

      - uses: actions/upload-artifact@v4
        with:
          name: canary-apk
          path: build/android/*.apk
